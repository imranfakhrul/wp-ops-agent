<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>WP Ops Agent architecture: two Run scan clicks meet the scan lock</title>
  <desc>Two admins click Run scan at once. nginx sends one click to each WordPress server. Server 1 takes the lock row in MariaDB with INSERT IGNORE; server 2 gets zero rows and answers busy. Server 1 scans, saves the report, deletes only its own lock and answers Scan finished.</desc>

  <!-- One 9-second cycle; every animation starts from this clock. -->
  <rect width="0" height="0"><animate id="clock" attributeName="x" from="0" to="0" dur="9s" begin="0s;clock.end"/></rect>

  <rect x="0" y="0" width="960" height="560" rx="14" fill="#ffffff"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0f172a">WP Ops Agent — how a click moves through the system</text>
  <text x="928" y="40" font-size="12" fill="#64748b" text-anchor="end">updated with build 3b · scan lock</text>

  <!-- Wires -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <path d="M170 178 L260 262"/>
    <path d="M170 358 L260 280"/>
    <path d="M410 255 L500 165"/>
    <path d="M410 285 L500 375"/>
    <path d="M660 165 L740 232"/>
    <path d="M660 375 L740 232"/>
    <path d="M660 165 L740 292"/>
    <path d="M660 375 L740 352"/>
  </g>

  <!-- Browsers -->
  <g>
    <rect x="40" y="150" width="130" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="176" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Admin A</text>
    <text x="105" y="194" font-size="11" fill="#64748b" text-anchor="middle">clicks Run scan</text>
    <rect x="40" y="330" width="130" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="356" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Admin B</text>
    <text x="105" y="374" font-size="11" fill="#64748b" text-anchor="middle">clicks Run scan</text>
  </g>

  <!-- Load balancer -->
  <rect x="260" y="235" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="335" y="264" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">nginx :8080</text>
  <text x="335" y="283" font-size="11" fill="#64748b" text-anchor="middle">load balancer, round robin</text>

  <!-- App servers -->
  <rect x="500" y="130" width="160" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="580" y="160" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">WordPress 1</text>
  <text x="580" y="179" font-size="11" fill="#4338ca" text-anchor="middle">stateless · plugin code</text>
  <rect x="500" y="340" width="160" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="580" y="370" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">WordPress 2</text>
  <text x="580" y="389" font-size="11" fill="#4338ca" text-anchor="middle">stateless · plugin code</text>

  <!-- Server 1 working badge -->
  <g opacity="0">
    <rect x="525" y="96" width="110" height="24" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="580" y="113" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">scanning…</text>
    <animate attributeName="opacity" values="1;0.45;1" dur="0.8s" begin="clock.begin+2.4s" repeatCount="4"/>
    <set attributeName="opacity" to="1" begin="clock.begin+2.4s" dur="3.2s"/>
  </g>

  <!-- Database -->
  <rect x="740" y="150" width="190" height="270" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
  <text x="835" y="180" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle">MariaDB</text>
  <text x="835" y="197" font-size="11" fill="#0f766e" text-anchor="middle">the one shared source of truth</text>

  <!-- Lock row -->
  <rect x="752" y="210" width="166" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <set attributeName="fill" to="#dcfce7" begin="clock.begin+2.4s" dur="4s"/>
    <set attributeName="stroke" to="#16a34a" begin="clock.begin+2.4s" dur="4s"/>
    <set attributeName="stroke" to="#dc2626" begin="clock.begin+3.2s" dur="0.6s"/>
  </rect>
  <text x="764" y="228" font-size="12" font-weight="600" fill="#0f172a">wpoa_scan_lock</text>
  <text x="764" y="246" font-size="11" fill="#64748b">no row — free
    <set attributeName="opacity" to="0" begin="clock.begin+2.4s" dur="4s"/>
  </text>
  <text x="764" y="246" font-size="11" fill="#15803d" opacity="0">uuid-A | time | user A
    <set attributeName="opacity" to="1" begin="clock.begin+2.4s" dur="4s"/>
  </text>

  <!-- Report row -->
  <rect x="752" y="270" width="166" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <set attributeName="fill" to="#dbeafe" begin="clock.begin+6.4s" dur="2.6s"/>
    <set attributeName="stroke" to="#2563eb" begin="clock.begin+6.4s" dur="2.6s"/>
  </rect>
  <text x="764" y="288" font-size="12" font-weight="600" fill="#0f172a">wpoa_last_report</text>
  <text x="764" y="306" font-size="11" fill="#64748b">saved scan · autoload off
    <set attributeName="opacity" to="0" begin="clock.begin+6.4s" dur="2.6s"/>
  </text>
  <text x="764" y="306" font-size="11" fill="#1d4ed8" opacity="0">new report saved by A
    <set attributeName="opacity" to="1" begin="clock.begin+6.4s" dur="2.6s"/>
  </text>

  <!-- Fix history row -->
  <rect x="752" y="330" width="166" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="764" y="348" font-size="12" font-weight="600" fill="#0f172a">wp_wpoa_fix_history</text>
  <text x="764" y="366" font-size="11" fill="#64748b">one INSERT per Fix click</text>

  <!-- Moving requests -->
  <!-- Admin A: browser → nginx → server 1 → lock row -->
  <circle r="7" fill="#6366f1" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin" dur="2.4s"/>
    <animateMotion path="M170 178 L260 262" begin="clock.begin" dur="0.8s" fill="freeze"/>
    <animateMotion path="M410 255 L500 165" begin="clock.begin+0.8s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M660 165 L740 232" begin="clock.begin+1.6s" dur="0.8s" fill="freeze"/>
  </circle>
  <!-- Admin B: browser → nginx → server 2 → lock row → back as busy -->
  <circle r="7" fill="#f59e0b" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+0.3s" dur="4.5s"/>
    <animateMotion path="M170 358 L260 280" begin="clock.begin+0.3s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M410 285 L500 375" begin="clock.begin+1.1s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M660 375 L740 232" begin="clock.begin+2.4s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M740 232 L660 375" begin="clock.begin+3.2s" dur="0.6s" fill="freeze"/>
    <animateMotion path="M500 375 L410 285" begin="clock.begin+3.8s" dur="0.5s" fill="freeze"/>
    <animateMotion path="M260 280 L170 358" begin="clock.begin+4.3s" dur="0.5s" fill="freeze"/>
  </circle>
  <!-- Server 1 saves the report, releases its lock, answers A -->
  <circle r="7" fill="#2563eb" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+5.6s" dur="0.8s"/>
    <animateMotion path="M660 165 L740 292" begin="clock.begin+5.6s" dur="0.8s" fill="freeze"/>
  </circle>
  <circle r="7" fill="#16a34a" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+6.4s" dur="1.6s"/>
    <animateMotion path="M500 165 L410 255" begin="clock.begin+6.4s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M260 262 L170 178" begin="clock.begin+7.2s" dur="0.8s" fill="freeze"/>
  </circle>

  <!-- Labels on the wires -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="580" y="222" fill="#15803d" opacity="0">INSERT IGNORE → 1 row: lock taken
      <set attributeName="opacity" to="1" begin="clock.begin+2.4s" dur="1.6s"/>
    </text>
    <text x="580" y="330" fill="#b91c1c" opacity="0">INSERT IGNORE → 0 rows: busy
      <set attributeName="opacity" to="1" begin="clock.begin+3.2s" dur="1.6s"/>
    </text>
    <text x="580" y="222" fill="#1d4ed8" opacity="0">DELETE … WHERE value = mine
      <set attributeName="opacity" to="1" begin="clock.begin+6.4s" dur="2.6s"/>
    </text>
  </g>

  <!-- Answers at the browsers -->
  <g font-size="12" font-weight="700">
    <g opacity="0">
      <rect x="40" y="398" width="200" height="26" rx="13" fill="#fef3c7" stroke="#d97706"/>
      <text x="140" y="416" fill="#92400e" text-anchor="middle">Another scan is running</text>
      <set attributeName="opacity" to="1" begin="clock.begin+4.8s" dur="4.2s"/>
    </g>
    <g opacity="0">
      <rect x="40" y="114" width="130" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
      <text x="105" y="132" fill="#166534" text-anchor="middle">Scan finished</text>
      <set attributeName="opacity" to="1" begin="clock.begin+8s" dur="1s"/>
    </g>
  </g>

  <!-- Step narration -->
  <rect x="32" y="456" width="896" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="14" fill="#0f172a">
    <text x="52" y="500" opacity="0"><tspan font-weight="700">1.</tspan> Two admins click Run scan at the same moment. nginx sends one click to each server.
      <set attributeName="opacity" to="1" begin="clock.begin" dur="2.4s"/>
    </text>
    <text x="52" y="500" opacity="0"><tspan font-weight="700">2.</tspan> Server 1's INSERT IGNORE creates the lock row first. The unique key lets only one win.
      <set attributeName="opacity" to="1" begin="clock.begin+2.4s" dur="0.8s"/>
    </text>
    <text x="52" y="500" opacity="0"><tspan font-weight="700">3.</tspan> Server 2's INSERT IGNORE inserts 0 rows: busy. The saved report is not touched.
      <set attributeName="opacity" to="1" begin="clock.begin+3.2s" dur="2.4s"/>
    </text>
    <text x="52" y="500" opacity="0"><tspan font-weight="700">4.</tspan> Server 1 scans, then saves the report with autoload off.
      <set attributeName="opacity" to="1" begin="clock.begin+5.6s" dur="0.8s"/>
    </text>
    <text x="52" y="500" opacity="0"><tspan font-weight="700">5.</tspan> It deletes only its own lock (value-checked DELETE) and answers Admin A.
      <set attributeName="opacity" to="1" begin="clock.begin+6.4s" dur="2.6s"/>
    </text>
  </g>
</svg>
