<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>WP Ops Agent architecture: Run scan queues a job, the cron clock runs it under the scan lock</title>
  <desc>Two admins click Run scan. nginx sends one click to each WordPress server; each server only adds a job to the Action Scheduler queue table in MariaDB and answers Scan scheduled. Every 60 seconds the cron container requests wp-cron.php through nginx, and the server it lands on claims both due jobs. Job A takes the lock row with INSERT IGNORE, scans, saves the report, deletes only its own lock and is marked complete. Job B runs next, finds the lock free and scans again.</desc>

  <!-- One 16.5-second cycle; every animation starts from this clock. -->
  <rect width="0" height="0"><animate id="clock" attributeName="x" from="0" to="0" dur="16.5s" begin="0s;clock.end"/></rect>

  <rect x="0" y="0" width="960" height="540" rx="14" fill="#ffffff"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0f172a">WP Ops Agent — how a click moves through the system</text>
  <text x="928" y="40" font-size="12" fill="#64748b" text-anchor="end">updated with build 4 · background queue</text>

  <!-- Wires -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <path d="M170 138 L260 255"/>
    <path d="M170 253 L260 270"/>
    <path d="M170 373 L260 290" stroke-dasharray="5 4"/>
    <path d="M410 255 L500 165"/>
    <path d="M410 285 L500 365"/>
    <path d="M660 165 L740 191"/>
    <path d="M660 365 L740 191"/>
    <path d="M660 365 L740 257"/>
    <path d="M660 365 L740 313"/>
  </g>

  <!-- Browsers -->
  <g>
    <rect x="40" y="110" width="130" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="136" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Admin A</text>
    <text x="105" y="154" font-size="11" fill="#64748b" text-anchor="middle">clicks Run scan</text>
    <rect x="40" y="225" width="130" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="251" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Admin B</text>
    <text x="105" y="269" font-size="11" fill="#64748b" text-anchor="middle">clicks Run scan</text>
  </g>

  <!-- Cron clock -->
  <rect x="40" y="345" width="130" height="56" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5">
    <set attributeName="stroke-width" to="3.5" begin="clock.begin+3.9s" dur="1.1s"/>
  </rect>
  <text x="105" y="371" font-size="14" font-weight="600" fill="#134e4a" text-anchor="middle">cron container</text>
  <text x="105" y="389" font-size="11" fill="#0f766e" text-anchor="middle">wp-cron.php · 60 s</text>

  <!-- Load balancer -->
  <rect x="260" y="235" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="335" y="264" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">nginx :8080</text>
  <text x="335" y="283" font-size="11" fill="#64748b" text-anchor="middle">load balancer, round robin</text>

  <!-- App servers -->
  <rect x="500" y="130" width="160" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="580" y="160" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">WordPress 1</text>
  <text x="580" y="179" font-size="11" fill="#4338ca" text-anchor="middle">stateless · plugin code</text>
  <rect x="500" y="330" width="160" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="580" y="360" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">WordPress 2</text>
  <text x="580" y="379" font-size="11" fill="#4338ca" text-anchor="middle">stateless · plugin code</text>

  <!-- Server 2 working badge: job A, then job B -->
  <g opacity="0">
    <rect x="525" y="296" width="110" height="24" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="580" y="313" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">scanning…</text>
    <set attributeName="opacity" to="1" begin="clock.begin+8.4s" dur="1.6s"/>
    <set attributeName="opacity" to="1" begin="clock.begin+12.4s" dur="1.2s"/>
  </g>

  <!-- Database -->
  <rect x="740" y="110" width="190" height="300" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
  <text x="835" y="136" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle">MariaDB</text>
  <text x="835" y="152" font-size="11" fill="#0f766e" text-anchor="middle">the one shared source of truth</text>

  <!-- Queue table -->
  <rect x="752" y="160" width="166" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <set attributeName="fill" to="#ccfbf1" begin="clock.begin+2.4s" dur="14.1s"/>
    <set attributeName="stroke" to="#0d9488" begin="clock.begin+2.4s" dur="14.1s"/>
  </rect>
  <text x="764" y="178" font-size="12" font-weight="600" fill="#0f172a">actionscheduler_actions</text>
  <text x="764" y="196" font-size="11" fill="#64748b" opacity="0">queue — no jobs
    <set attributeName="opacity" to="1" begin="clock.begin" dur="2.4s"/>
  </text>
  <g font-size="11">
    <text x="764" y="196" fill="#0f766e" opacity="0">job A · pending
      <set attributeName="opacity" to="1" begin="clock.begin+2.4s" dur="4.2s"/>
    </text>
    <text x="764" y="196" fill="#0f766e" opacity="0">job A · claimed by WP 2
      <set attributeName="opacity" to="1" begin="clock.begin+6.6s" dur="4.2s"/>
    </text>
    <text x="764" y="196" fill="#15803d" font-weight="600" opacity="0">job A · complete
      <set attributeName="opacity" to="1" begin="clock.begin+10.8s" dur="5.7s"/>
    </text>
    <text x="764" y="212" fill="#0f766e" opacity="0">job B · pending
      <set attributeName="opacity" to="1" begin="clock.begin+2.7s" dur="3.9s"/>
    </text>
    <text x="764" y="212" fill="#0f766e" opacity="0">job B · claimed by WP 2
      <set attributeName="opacity" to="1" begin="clock.begin+6.6s" dur="7.8s"/>
    </text>
    <text x="764" y="212" fill="#15803d" font-weight="600" opacity="0">job B · complete
      <set attributeName="opacity" to="1" begin="clock.begin+14.4s" dur="2.1s"/>
    </text>
  </g>

  <!-- Lock row -->
  <rect x="752" y="234" width="166" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <set attributeName="fill" to="#dcfce7" begin="clock.begin+8.4s" dur="2.4s"/>
    <set attributeName="stroke" to="#16a34a" begin="clock.begin+8.4s" dur="2.4s"/>
    <set attributeName="fill" to="#fef3c7" begin="clock.begin+12.4s" dur="2s"/>
    <set attributeName="stroke" to="#d97706" begin="clock.begin+12.4s" dur="2s"/>
  </rect>
  <text x="764" y="252" font-size="12" font-weight="600" fill="#0f172a">wpoa_scan_lock</text>
  <g font-size="11">
    <text x="764" y="270" fill="#64748b" opacity="0">no row — free
      <set attributeName="opacity" to="1" begin="clock.begin" dur="8.4s"/>
      <set attributeName="opacity" to="1" begin="clock.begin+10.8s" dur="1.6s"/>
      <set attributeName="opacity" to="1" begin="clock.begin+14.4s" dur="2.1s"/>
    </text>
    <text x="764" y="270" fill="#15803d" opacity="0">uuid | time | job A
      <set attributeName="opacity" to="1" begin="clock.begin+8.4s" dur="2.4s"/>
    </text>
    <text x="764" y="270" fill="#b45309" opacity="0">uuid | time | job B
      <set attributeName="opacity" to="1" begin="clock.begin+12.4s" dur="2s"/>
    </text>
  </g>

  <!-- Report row -->
  <rect x="752" y="290" width="166" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5">
    <set attributeName="fill" to="#dbeafe" begin="clock.begin+10.8s" dur="5.7s"/>
    <set attributeName="stroke" to="#2563eb" begin="clock.begin+10.8s" dur="5.7s"/>
  </rect>
  <text x="764" y="308" font-size="12" font-weight="600" fill="#0f172a">wpoa_last_report</text>
  <g font-size="11">
    <text x="764" y="326" fill="#64748b" opacity="0">saved scan · autoload off
      <set attributeName="opacity" to="1" begin="clock.begin" dur="10.8s"/>
    </text>
    <text x="764" y="326" fill="#1d4ed8" opacity="0">saved by job A (user A)
      <set attributeName="opacity" to="1" begin="clock.begin+10.8s" dur="3.6s"/>
    </text>
    <text x="764" y="326" fill="#1d4ed8" opacity="0">saved by job B (user B)
      <set attributeName="opacity" to="1" begin="clock.begin+14.4s" dur="2.1s"/>
    </text>
  </g>

  <!-- Fix history row -->
  <rect x="752" y="346" width="166" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="764" y="364" font-size="12" font-weight="600" fill="#0f172a">wp_wpoa_fix_history</text>
  <text x="764" y="382" font-size="11" fill="#64748b">one INSERT per Fix click</text>

  <!-- Moving requests -->
  <!-- Admin A: browser → nginx → server 1 → queue -->
  <circle r="7" fill="#6366f1" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin" dur="2.4s"/>
    <animateMotion path="M170 138 L260 255" begin="clock.begin" dur="0.8s" fill="freeze"/>
    <animateMotion path="M410 255 L500 165" begin="clock.begin+0.8s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M660 165 L740 191" begin="clock.begin+1.6s" dur="0.8s" fill="freeze"/>
  </circle>
  <!-- Server 1 answers A at once -->
  <circle r="7" fill="#16a34a" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+2.4s" dur="1.2s"/>
    <animateMotion path="M500 165 L410 255" begin="clock.begin+2.4s" dur="0.6s" fill="freeze"/>
    <animateMotion path="M260 255 L170 138" begin="clock.begin+3s" dur="0.6s" fill="freeze"/>
  </circle>
  <!-- Admin B: browser → nginx → server 2 → queue -->
  <circle r="7" fill="#f59e0b" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+0.3s" dur="2.4s"/>
    <animateMotion path="M170 253 L260 270" begin="clock.begin+0.3s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M410 285 L500 365" begin="clock.begin+1.1s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M660 365 L740 191" begin="clock.begin+1.9s" dur="0.8s" fill="freeze"/>
  </circle>
  <!-- Server 2 answers B at once -->
  <circle r="7" fill="#16a34a" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+2.7s" dur="1.2s"/>
    <animateMotion path="M500 365 L410 285" begin="clock.begin+2.7s" dur="0.6s" fill="freeze"/>
    <animateMotion path="M260 270 L170 253" begin="clock.begin+3.3s" dur="0.6s" fill="freeze"/>
  </circle>
  <!-- Cron tick: container → nginx → server 2 → claims the jobs -->
  <circle r="7" fill="#0d9488" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+4.2s" dur="2.4s"/>
    <animateMotion path="M170 373 L260 290" begin="clock.begin+4.2s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M410 285 L500 365" begin="clock.begin+5s" dur="0.8s" fill="freeze"/>
    <animateMotion path="M660 365 L740 191" begin="clock.begin+5.8s" dur="0.8s" fill="freeze"/>
  </circle>
  <!-- Job A: take the lock, then save the report -->
  <circle r="7" fill="#6366f1" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+7.6s" dur="0.8s"/>
    <animateMotion path="M660 365 L740 257" begin="clock.begin+7.6s" dur="0.8s" fill="freeze"/>
  </circle>
  <circle r="7" fill="#6366f1" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+10s" dur="0.8s"/>
    <animateMotion path="M660 365 L740 313" begin="clock.begin+10s" dur="0.8s" fill="freeze"/>
  </circle>
  <!-- Job B: take the lock, then save the report -->
  <circle r="7" fill="#f59e0b" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+11.6s" dur="0.8s"/>
    <animateMotion path="M660 365 L740 257" begin="clock.begin+11.6s" dur="0.8s" fill="freeze"/>
  </circle>
  <circle r="7" fill="#f59e0b" opacity="0">
    <set attributeName="opacity" to="1" begin="clock.begin+13.6s" dur="0.8s"/>
    <animateMotion path="M660 365 L740 313" begin="clock.begin+13.6s" dur="0.8s" fill="freeze"/>
  </circle>

  <!-- Labels on the wires -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="580" y="222" fill="#0f766e" opacity="0">INSERT job · answer at once
      <set attributeName="opacity" to="1" begin="clock.begin+2.4s" dur="1.5s"/>
    </text>
    <text x="580" y="422" fill="#0f766e" opacity="0">INSERT job · answer at once
      <set attributeName="opacity" to="1" begin="clock.begin+2.7s" dur="1.2s"/>
    </text>
    <text x="580" y="422" fill="#0f766e" opacity="0">claim due jobs: UPDATE … SET claim_id
      <set attributeName="opacity" to="1" begin="clock.begin+6.6s" dur="1s"/>
    </text>
    <text x="580" y="422" fill="#15803d" opacity="0">INSERT IGNORE → 1 row: lock taken
      <set attributeName="opacity" to="1" begin="clock.begin+8.4s" dur="1.6s"/>
      <set attributeName="opacity" to="1" begin="clock.begin+12.4s" dur="1.2s"/>
    </text>
    <text x="580" y="422" fill="#1d4ed8" opacity="0">save report · DELETE … WHERE value = mine
      <set attributeName="opacity" to="1" begin="clock.begin+10.8s" dur="0.8s"/>
      <set attributeName="opacity" to="1" begin="clock.begin+14.4s" dur="2.1s"/>
    </text>
  </g>

  <!-- Answers at the browsers -->
  <g font-size="12" font-weight="700">
    <g opacity="0">
      <rect x="40" y="76" width="130" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
      <text x="105" y="94" fill="#166534" text-anchor="middle">Scan scheduled</text>
      <set attributeName="opacity" to="1" begin="clock.begin+3.6s" dur="12.9s"/>
    </g>
    <g opacity="0">
      <rect x="40" y="289" width="130" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
      <text x="105" y="307" fill="#166534" text-anchor="middle">Scan scheduled</text>
      <set attributeName="opacity" to="1" begin="clock.begin+3.9s" dur="12.6s"/>
    </g>
  </g>

  <!-- Step narration -->
  <rect x="32" y="440" width="896" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="14" fill="#0f172a">
    <text x="52" y="484" opacity="0"><tspan font-weight="700">1.</tspan> Two admins click Run scan. Each server only adds a job to the queue and answers at once.
      <set attributeName="opacity" to="1" begin="clock.begin" dur="3.9s"/>
    </text>
    <text x="52" y="484" opacity="0"><tspan font-weight="700">2.</tspan> Every 60 s the cron container requests wp-cron.php. nginx sends it to any server, here WordPress 2.
      <set attributeName="opacity" to="1" begin="clock.begin+3.9s" dur="1.9s"/>
    </text>
    <text x="52" y="484" opacity="0"><tspan font-weight="700">3.</tspan> WordPress 2 claims both due jobs in the queue table, so no other server runs them too.
      <set attributeName="opacity" to="1" begin="clock.begin+5.8s" dur="1.8s"/>
    </text>
    <text x="52" y="484" opacity="0"><tspan font-weight="700">4.</tspan> Job A takes the scan lock with INSERT IGNORE and scans. The job carries user A's ID.
      <set attributeName="opacity" to="1" begin="clock.begin+7.6s" dur="2.4s"/>
    </text>
    <text x="52" y="484" opacity="0"><tspan font-weight="700">5.</tspan> Job A saves the report, deletes only its own lock, and is marked complete.
      <set attributeName="opacity" to="1" begin="clock.begin+10s" dur="1.6s"/>
    </text>
    <text x="52" y="484" opacity="0"><tspan font-weight="700">6.</tspan> Job B runs next. The lock is free again, so it scans a second time: duplicate jobs are not merged yet.
      <set attributeName="opacity" to="1" begin="clock.begin+11.6s" dur="4.9s"/>
    </text>
  </g>
</svg>
